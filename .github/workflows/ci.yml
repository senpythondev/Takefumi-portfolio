name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  # Manual runs (gh workflow run CI --ref <branch>). Needs this file on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A normal run takes about 25 min (E2E alone varies 6–11 min between runners). Infrastructure
    # headroom only: no budget or assertion depends on it.
    timeout-minutes: 40
    env:
      NEXT_PUBLIC_ENABLE_PEGASUS_LINK: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Confidentiality (deterministic first line)
        run: npm run check:confidentiality

      - name: Content validation (schema, ja/en parity, fact-lint)
        run: npm run validate

      - run: npm run lint
      - run: npm run typecheck

      - name: Build (prebuild repeats validation + confidentiality)
        run: npm run build

      - name: apt retries stalled downloads instead of hanging
        # CI run 44510240203: an apt download for the WebKit dependencies (118 MB) stalled for 18 min
        # and the job limit cancelled everything after it. Time out and retry instead.
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' | sudo tee /etc/apt/apt.conf.d/80-ci-retries

      - name: CJK fallback font
        # The site self-hosts subset fonts with font-display: optional: a page view whose font arrives
        # late renders with the system fallback, so the runner needs a CJK font for that path.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-droid-fallback

      - name: Browsers and their system packages (Chromium, WebKit, Firefox), in one apt run
        timeout-minutes: 15
        run: npx playwright install --with-deps chromium webkit firefox

      - name: E2E (desktop / mobile / reduced-motion)
        # Visual baselines are machine-specific (font rasterisation, WebGL): checked locally only.
        run: npm run test:e2e -- --grep-invert @visual
        env:
          PW_REPORT: e2e

      - name: Safari behaviour (Playwright WebKit, iPhone viewport)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx playwright test --project=webkit
        env:
          PW_REPORT: webkit

      - name: Firefox behaviour (Playwright Firefox, desktop viewport)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: npx playwright test --project=firefox
        env:
          PW_REPORT: firefox

      - name: Initial-JS budget
        # Measurements still run when an earlier check fails, so every result is reported.
        if: ${{ !cancelled() }}
        run: npm run budget
        env:
          PW_REPORT: budget

      - name: Lighthouse CI (mobile, budgets from CLAUDE.md §4)
        if: ${{ !cancelled() }}
        run: npm run lhci

      - name: INP (mobile, CPU 4×, real interactions on the home — CLAUDE.md §4)
        # Lighthouse measures page loads only; INP is a pass/fail condition, so it is measured here.
        if: ${{ !cancelled() }}
        run: npx playwright test --project=perf tests/perf/inp.spec.ts
        env:
          PW_REPORT: inp

      - name: Japanese layout probe (informational, PM_REVIEW_07 §2-3)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test --project=perf tests/perf/ja-layout.spec.ts
        env:
          PW_REPORT: ja-layout

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # .lighthouseci is a dot-directory: excluded by default since upload-artifact v4.
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            perf-results/
            .lighthouseci/
          retention-days: 14
