name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  # Manual runs (gh workflow run CI --ref <branch>). Needs this file on the default branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_ENABLE_PEGASUS_LINK: 'false'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Confidentiality (deterministic first line)
        run: npm run check:confidentiality

      - name: Content validation (schema, ja/en parity, fact-lint)
        run: npm run validate

      - run: npm run lint
      - run: npm run typecheck

      - name: Build (prebuild repeats validation + confidentiality)
        run: npm run build

      - name: Fonts matching the local screenshot baselines
        # Until Phase 4 self-hosts subset fonts, CJK text falls back to the system font.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-droid-fallback

      - run: npx playwright install --with-deps chromium

      - name: E2E (desktop / mobile / reduced-motion)
        # Visual baselines are machine-specific until Phase 4 self-hosts fonts: checked locally only.
        run: npm run test:e2e -- --grep-invert @visual
        env:
          PW_REPORT: e2e

      - name: Safari behaviour (Playwright WebKit, iPhone viewport)
        if: ${{ !cancelled() }}
        run: npx playwright install --with-deps webkit && npx playwright test --project=webkit
        env:
          PW_REPORT: webkit

      - name: Initial-JS budget
        # Measurements still run when an earlier check fails, so every result is reported.
        if: ${{ !cancelled() }}
        run: npm run budget
        env:
          PW_REPORT: budget

      - name: Lighthouse CI (mobile, budgets from CLAUDE.md §4)
        if: ${{ !cancelled() }}
        run: npm run lhci

      - name: Japanese layout probe (informational, PM_REVIEW_07 §2-3)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npx playwright test --project=perf tests/perf/ja-layout.spec.ts
        env:
          PW_REPORT: ja-layout

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          # .lighthouseci is a dot-directory: excluded by default since upload-artifact v4.
          include-hidden-files: true
          path: |
            playwright-report/
            test-results/
            perf-results/
            .lighthouseci/
          retention-days: 14
